<meta charset="utf-8">

@font-face{font-family:'Baloo 2';font-weight:600;src:url(../cocuk-kanali/ahtapot/fonts/baloo-2-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'Baloo 2';font-weight:800;src:url(../cocuk-kanali/ahtapot/fonts/baloo-2-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-weight:800;src:url(../cocuk-kanali/ahtapot/fonts/baloo-2-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+A720-A7FF}

</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../cocuk-kanali/ahtapot/js/core.js"></script><script src="../cocuk-kanali/ahtapot/js/octopus.js"></script>
<script>
// Ders paketi: Oki parametre → görünüm rehberi (4x3)
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const V = [
  ['{}  // varsayılan: idle', {}],
  ["{ waveArm: 1, mouth: 'open' }", { waveArm: 1, mouth: 'open' }],
  ["{ eye: 'happy', mouth: 'grin' }", { eye: 'happy', mouth: 'grin' }],
  ["{ eye: 'surprised', mouth: 'o', brow: 'raised' }", { eye: 'surprised', mouth: 'o', brow: 'raised' }],
  ["{ mouth: 'wavy', brow: 'worried' }", { mouth: 'wavy', brow: 'worried' }],
  ["{ brow: 'determined', mouth: 'flat' }", { brow: 'determined', mouth: 'flat' }],
  ["{ pose: 'cheer' }", { pose: 'cheer', mouth: 'grin' }],
  ["{ pose: 'swim', rot: -1.1 }", { pose: 'swim', rot: -1.1 }],
  ["{ pose: 'squeeze', sx: .55, sy: 1.3 }", { pose: 'squeeze', sx: .55, sy: 1.3, mouth: 'wavy' }],
  ["{ xray: 1, hearts: { highlight: 'main' } }", { xray: 1, hearts: { highlight: 'main' } }],
  ["{ neuro: 1 }", { neuro: 1, mouth: 'o' }],
  ["{ color: PAL.rock, bumps: 1, mottle: {…}, blush: 0, eye: 'closed' }", { color: PAL.rock, bumps: 1, mottle: { color: PAL.rock2, amount: .75, seed: 9 }, blush: 0, eye: 'closed', mouth: 'flat' }]
];
window.renderFrame = function (t) {
  ctx.fillStyle = '#F4FBFC'; ctx.fillRect(0, 0, W, H);
  V.forEach(([lbl, o], i) => {
    const cx = (i % 4) * 480 + 240, cy = Math.floor(i / 4) * 360;
    ctx.strokeStyle = '#D5E6EA'; ctx.lineWidth = 2; ctx.strokeRect((i % 4) * 480 + 1, cy + 1, 478, 358);
    const swim = o.pose === 'swim';
    drawOki(ctx, cx + (swim ? 40 : 0), cy + (swim ? 200 : 205), .6, { seed: i, blink: 0, ...o }, 1.2 + i * .37);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect((i % 4) * 480 + 2, cy + 308, 476, 50);
    ctx.font = '600 19px "DejaVu Sans Mono", monospace'; const fs = Math.min(19, 19 * 456 / ctx.measureText(lbl).width);
    ctx.font = `600 ${fs}px "DejaVu Sans Mono", monospace`; ctx.fillStyle = PAL.navy; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lbl, cx, cy + 333);
  });
};
window.ready = document.fonts.ready;
</script></body></html>
